<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BanDy - Adicionar Festival</title>

    <!-- Ficheiros CSS -->
    <link rel="stylesheet" href="css/positions.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- JavaScript -->
    <script src="js/autenticacao.js" defer></script>
    <script src="js/saldo.js" defer></script>
    <script src="js/festivais.js" defer></script>
    <script src="js/adicionar_festival.js" defer></script>

    <!-- Script para ícones -->
    <script src="https://kit.fontawesome.com/81afda5663.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="aplicacao">

        <!-- Cabeçalho -->
        <header class="barra-superior">

            <a href="inicio.html" class="botao-voltar">
                ←
            </a>

            <span class="titulo-cabecalho">
                BanDy
            </span>

            <span class="saldo-cabecalho" data-saldo>
                0,00 €
            </span>

        </header>


        <!-- Conteúdo principal -->
        <section class="conteudo-festivais">

            <h1 class="titulo-festivais">Adicionar festival</h1>

            <!-- Já tenho bilhete -->
            <button class="botao-operacao"
                    type="button"
                    data-acao="ja-tenho-bilhete">

                <span>Já tenho bilhete</span>
                <span class="icone-operacao"><i class="fa-solid fa-ticket"></i></span>

            </button>


            <!-- Próximos festivais -->
            <section class="secao-festivais">

                <h2>Próximos festivais</h2>

                <label class="campo-pesquisa">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search"
                           id="pesquisa-festival"
                           placeholder="Pesquisar festival"
                           autocomplete="off">
                </label>

                <div class="lista-festivais" id="lista-festivais"></div>

                <p class="sem-resultados" id="sem-resultados" hidden>
                    Nenhum festival encontrado. Tenta outro nome.
                </p>

            </section>

        </section>


        <!-- Menu de navegação inferior -->
        <nav class="barra-navegacao">

            <a href="inicio.html" class="botao-navegacao ativo">
                <span class="icone-navegacao"><i class="fa-solid fa-house"></i></span>
                <span>Início</span>
            </a>

            <a href="carteira.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-wallet"></i></span>
                <span>Carteira</span>
            </a>

            <a href="perfil.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-user"></i></span>
                <span>Perfil</span>
            </a>

        </nav>

    </main>

</body>
</html>
