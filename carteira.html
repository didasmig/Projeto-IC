<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BanDy - Carteira</title>

    <!-- Ficheiros CSS -->
    <link rel="stylesheet" href="css/positions.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- JavaScript -->
    <script src="js/saldo.js" defer></script>
    <script src="js/carteira.js" defer></script>
    <!-- Script para ícones -->
    <script src="https://kit.fontawesome.com/81afda5663.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="aplicacao">

        <!-- Cabeçalho -->
        <header class="barra-superior">

            <a href="inicio.html" class="botao-voltar">
                ←
            </a>

            <span class="titulo-cabecalho">
                BanDy
            </span>

            <span class="saldo-cabecalho" data-saldo>
                34,29 €
            </span>

        </header>


        <!-- Conteúdo principal -->
        <section class="conteudo-carteira">

            <!-- Saldo atual -->
            <section class="cartao-saldo">

                <div class="informacao-saldo">

                    <div>
                        <h2>Saldo Atual</h2>

                        <p class="valor-saldo" data-saldo>
                            34,29 €
                        </p>
                    </div>

                    <button class="botao-ocultar-saldo"
                            type="button"
                            aria-label="Ocultar saldo"
                            data-acao="ocultar-saldo">
                        ◉
                    </button>

                </div>

            </section>


            <!-- Operações da carteira -->
            <section class="operacoes-carteira">

                <button class="botao-operacao"
                        type="button"
                        data-acao="depositar">

                    <span>Depositar</span>
                    <span class="icone-operacao">⊕</span>

                </button>


                <button class="botao-operacao"
                        type="button"
                        data-acao="pagamento">

                    <span>Pagamento</span>
                    <span class="icone-operacao">🛒</span>

                </button>


                <button class="botao-operacao"
                        type="button"
                        data-acao="transferir">

                    <span>Transferir</span>
                    <span class="icone-operacao">⇄</span>

                </button>


                <button class="botao-operacao"
                        type="button"
                        data-acao="conta-conjunta">

                    <span>Conta Conjunta</span>
                    <span class="icone-operacao"><i class="fa-solid fa-users"></i></span>

                </button>

            </section>


            <!-- Últimos movimentos -->
            <section class="secao-movimentos">

                <h2>Últimos movimentos</h2>

                <div class="lista-movimentos">

                    <article class="movimento">

                        <div class="informacao-movimento">
                            <span class="nome-movimento">
                                Transferência - Rui
                            </span>
                        </div>

                        <span class="valor-negativo">
                            -30 €
                        </span>

                    </article>


                    <article class="movimento">

                        <div class="informacao-movimento">
                            <span class="nome-movimento">
                                Pagamento - Bar
                            </span>
                        </div>

                        <span class="valor-negativo">
                            -45 €
                        </span>

                    </article>


                    <article class="movimento">

                        <div class="informacao-movimento">
                            <span class="nome-movimento">
                                Carregamento
                            </span>
                        </div>

                        <span class="valor-positivo">
                            +50 €
                        </span>

                    </article>

                </div>

            </section>

        </section>


        <!-- Menu de navegação inferior -->
        <nav class="barra-navegacao">

            <a href="inicio.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-house"></i></span>
                <span>Início</span>
            </a>


            <a href="carteira.html"
               class="botao-navegacao ativo">

                <span class="icone-navegacao"><i class="fa-solid fa-wallet"></i></span>
                <span>Carteira</span>

            </a>


            <a href="perfil.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-user"></i></span>
                <span>Perfil</span>
            </a>

        </nav>

    </main>

</body>
</html>
