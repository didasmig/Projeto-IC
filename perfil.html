
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BanDy - Perfil</title>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/81afda5663.js" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/positions.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- JavaScript -->
    <script src="js/autenticacao.js" defer></script>
    <script src="js/saldo.js" defer></script>
    <script src="js/perfil.js" defer></script>
</head>

<body>
    <main class="aplicacao">

        <!-- Cabeçalho -->
        <header class="barra-superior">

            <a href="inicio.html" class="botao-voltar">←</a>

            <span class="titulo-cabecalho">BanDy</span>

            <span class="saldo-cabecalho" data-saldo>
                34,29 €
            </span>

        </header>

        <!-- Conteúdo do perfil -->
        
        <!-- PERFIL SEM LOGIN -->

        <section class="conteudo-perfil" id="perfil-visitante" hidden>

            <h2 class="titulo-perfil">O meu perfil</h2>

            <div class="cartao-perfil">

                <div class="avatar-perfil">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h3 class="nome-perfil">
                    Bem-vindo à BanDy
                </h3>

                <p class="subtitulo-perfil">
                    Inicia sessão para ver os teus dados.
                </p>

            </div>

            <button type="button"
                    class="botao-editar-perfil"
                    id="botao-login">
                Log-In
            </button>

        </section>


        <!-- PERFIL COM LOGIN -->

        <section class="conteudo-perfil" id="perfil-utilizador" hidden>

            <h2 class="titulo-perfil">O meu perfil</h2>

            <!-- Cartão do utilizador -->
            <div class="cartao-perfil">

                <div class="avatar-perfil">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h3 class="nome-perfil" id="perfil-nome-destaque"></h3>

                <p class="subtitulo-perfil">
                    Conta BanDy
                </p>

            </div>

            <!-- Informações pessoais -->
            <div class="secao-informacoes-perfil">

                <h3>Informações pessoais</h3>

                <div class="informacoes-perfil">

                    <div class="campo-perfil">
                        <span class="etiqueta-perfil">Nome</span>
                        <span class="valor-perfil" id="perfil-nome"></span>
                    </div>

                    <div class="campo-perfil">
                        <span class="etiqueta-perfil">Email</span>
                        <span class="valor-perfil" id="perfil-email"></span>
                    </div>

                    <div class="campo-perfil">
                        <span class="etiqueta-perfil">Data de nascimento</span>
                        <span class="valor-perfil" id="perfil-data"></span>
                    </div>

                    <div class="campo-perfil">
                        <span class="etiqueta-perfil">Género</span>
                        <span class="valor-perfil" id="perfil-genero"></span>
                    </div>

                </div>

            </div>

            <!-- Terminar sessão -->
            <button type="button"
                    class="botao-editar-perfil"
                    id="botao-terminar-sessao">
                Terminar sessão
            </button>

        </section>


        <!-- Menu de navegação inferior -->
        <nav class="barra-navegacao">

            <a href="inicio.html" class="botao-navegacao">
                <span class="icone-navegacao">
                    <i class="fa-solid fa-house"></i>
                </span>
                <span>Início</span>
            </a>

            <a href="carteira.html" class="botao-navegacao">
                <span class="icone-navegacao">
                    <i class="fa-solid fa-wallet"></i>
                </span>
                <span>Carteira</span>
            </a>

            <a href="perfil.html" class="botao-navegacao ativo" aria-current="page">
                <span class="icone-navegacao">
                    <i class="fa-solid fa-user"></i>
                </span>
                <span>Perfil</span>
            </a>

        </nav>

    </main>
</body>
</html>
