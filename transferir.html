<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BanDy - Transferência</title>

    <!-- Ficheiros CSS -->
    <link rel="stylesheet" href="css/positions.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- JavaScript -->

    <script src="js/autenticacao.js" defer></script>
    <script src="js/saldo.js" defer></script>
    <script src="js/transferencia.js" defer></script>

    <!-- Script para ícones -->
    <script src="https://kit.fontawesome.com/81afda5663.js" crossorigin="anonymous"></script>
</head>

<body>
    <main class="aplicacao">

        <!-- Cabeçalho -->
        <header class="barra-superior">

            <a href="carteira.html" class="botao-voltar">
                ←
            </a>

            <span class="titulo-cabecalho">
                BanDy
            </span>

            <span class="saldo-cabecalho" data-saldo>
                0,00 €
            </span>

        </header>
        
        <section class="conteudo-transferencia">
            <h2 class="titulo-transferencia">Transferência</h2>

            <form id="transferForm" class="formulario-transferencia">
                <label for="destinatario">Destinatário</label>
                <input type="text" id="destinatario" placeholder="Username ou telemóvel" required>

                <label for="quantia">Quantia (€)</label>
                <input type="number" id="quantia" placeholder="0,00" step="0.01" min="0.01" required>

                <p class="mensagem-conta" id="erro-transferencia" role="alert"></p>

                <button type="submit">Transferir</button>
            </form>
        </section>


        <!-- Notificação de transferência concluída -->
        <div class="notificacao" id="notificacao-transferencia" role="status" hidden>
            <div class="notificacao-texto">
                <strong id="notificacao-titulo"></strong>
                <span id="notificacao-mensagem"></span>
                <span id="notificacao-saldo"></span>
            </div>
            <button type="button" class="notificacao-fechar" id="notificacao-fechar"
                    aria-label="Fechar notificação">×</button>
        </div>


        <!-- Pop-up de confirmação -->
        <div class="popup-fundo" id="popup-confirmar-transferencia" hidden>
            <div class="popup popup-negativo" role="dialog" aria-modal="true" aria-labelledby="confirmar-titulo">
                <h3 id="confirmar-titulo">Confirmar transferência</h3>
                <p class="popup-valor" id="confirmar-valor"></p>
                <p id="confirmar-destinatario"></p>
                <p id="confirmar-saldo"></p>

                <div class="popup-botoes">
                    <button type="button" class="popup-fechar popup-cancelar" id="confirmar-cancelar">Cancelar</button>
                    <button type="button" class="popup-fechar" id="confirmar-confirmar">Confirmar</button>
                </div>
            </div>
        </div>

        <!-- Menu inferior -->
        <nav class="barra-navegacao">

            <a href="inicio.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-house"></i></span>
                <span>Início</span>
            </a>

            <a href="carteira.html" class="botao-navegacao ativo">
                <span class="icone-navegacao"><i class="fa-solid fa-wallet"></i></span>
                <span>Carteira</span>
            </a>

            <a href="perfil.html" class="botao-navegacao">
                <span class="icone-navegacao"><i class="fa-solid fa-user"></i></span>
                <span>Perfil</span>
            </a>
        </nav>

    </main>
</body>
</html>
